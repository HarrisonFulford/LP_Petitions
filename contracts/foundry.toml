[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./deployments" }]

# Fork tests run against real Base Sepolia state (Uniswap v4 + Chainlink ETH/USD).
# Set BASE_SEPOLIA_RPC_URL in .env (see .env.example). Fork tests are skipped
# gracefully when it is unset.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
